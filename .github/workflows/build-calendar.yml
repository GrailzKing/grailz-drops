name: Build & Deploy Drops Calendar

on:
  # Run every Monday at 9am CT (15:00 UTC)
  schedule:
    - cron: '0 15 * * 1'
  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # And auto-deploy whenever index.html is pushed directly
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'drops_data.py'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install openpyxl requests

      - name: Build index.html
        run: |
          if [ -f drops_data.py ]; then
            python drops_data.py
            echo "Built index.html from drops_data.py"
          else
            echo "No drops_data.py found — using existing index.html"
          fi

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto-update drops calendar $(date +'%Y-%m-%d')"
          git push
