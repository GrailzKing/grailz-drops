name: Build & Deploy Drops Calendar

on:
  schedule:
    - cron: '0 15 * * *'   # daily 9am CT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Build index.html only (do not overwrite data JSON files)
        run: |
          if [ -f drops_data.py ]; then
            python drops_data.py
          fi

      - name: Commit & push index.html only
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto-rebuild index.html $(date +'%Y-%m-%d')"
          git push
