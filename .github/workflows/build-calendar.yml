name: Build & Deploy Drops Calendar

on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Build index.html and data JSON
        run: |
          if [ -f drops_data.py ]; then
            python drops_data.py
            echo "Built index.html and data/*.json from drops_data.py"
          else
            echo "No drops_data.py found — using existing index.html"
          fi

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          git diff --cached --quiet || git commit -m "Auto-update drops calendar $(date +'%Y-%m-%d')"
          git push
