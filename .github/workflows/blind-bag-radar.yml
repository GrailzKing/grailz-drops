name: Blind Bag Radar stock check

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min (GitHub may run scheduled jobs a few minutes late)
  workflow_dispatch:          # "Run workflow" button in the Actions tab for an instant check

permissions:
  contents: write

concurrency:
  group: blind-bag-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check shops
        run: python blind-bag-radar/check_stock.py

      - name: Commit status.json if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blind-bag-radar/status.json
          if git diff --cached --quiet; then
            echo "No status change"
            exit 0
          fi
          git commit -m "Blind Bag Radar: stock update $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
