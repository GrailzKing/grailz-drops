name: Blind Bag Radar stock check

# Runs in ~5-hour shifts: check every 15 minutes, then start the next shift.
# GitHub's own timer often skips frequent schedules, so the cron below is only a
# backup that restarts the chain if it ever stops.
# To stop all checks: Actions -> Blind Bag Radar stock check -> "..." -> Disable workflow.

on:
  schedule:
    - cron: '7 */2 * * *'   # backup restart every 2 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # lets the shift start the next shift

concurrency:
  group: blind-bag-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check shops every 15 minutes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ROUNDS=20
          for i in $(seq 1 $ROUNDS); do
            echo "::group::Round $i of $ROUNDS ($(date -u +'%H:%M UTC'))"
            git pull -q --rebase origin main || true
            python blind-bag-radar/check_stock.py || echo "Checker failed this round"
            git add blind-bag-radar/status.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Blind Bag Radar: stock update $(date -u +'%Y-%m-%d %H:%M UTC')"
              for try in 1 2 3; do
                git pull -q --rebase origin main && git push -q && break
                sleep 5
              done
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$ROUNDS" ]; then sleep 840; fi
          done

      - name: Start the next shift
        if: success() || failure()   # a cancelled run does not restart
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run blind-bag-radar.yml --ref main
